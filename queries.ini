# =============================================================================
# queries.ini  –  Neptune ETL SQL registry
# =============================================================================
# All SQL statements used by neptune_etl.py are defined here so they can be
# reviewed, adapted, or replaced without touching Python code.
#
# Format
# ──────
# Standard Python configparser INI syntax.
# • Each section [prefix.name] holds a single key: sql =
# • Multiline values: every continuation line must be indented by at least
#   one space.  Leading/trailing blank lines within the value are preserved.
# • Structural placeholders use {name} syntax and are substituted by
#   SqlRegistry.get() before the statement reaches psycopg2.
#   Allowed structural placeholders:
#     {schema}      – PostgreSQL schema that owns the real (base) tables
#     {gsr_client}  – tenant client UUID string  (meta queries only)
#     {gsr_inst}    – tenant instance UUID string (meta queries only)
#   Both UUID placeholders are validated against a UUID regex before use.
# • Data-binding placeholders use standard psycopg2 %s (positional).
#   These are never touched by SqlRegistry.
#
# Temporary view pattern
# ──────────────────────
# On connect, MetaRepository executes the seven [meta.view.*] statements to
# create session-scoped temporary views (CREATE TEMP VIEW) in pg_temp.
# PostgreSQL automatically places pg_temp at the front of search_path, so all
# subsequent read queries may reference view names without any schema prefix.
# Views are dropped automatically when the connection closes.
#
# Because {schema} is used only inside the view body (the SELECT that reads
# the real tables), all subsequent SELECT queries use bare view names and carry
# no {schema} substitution.  {gsr_client} and {gsr_inst} are baked into the
# view definition at creation time, so read queries also need no tenant filters.
#
# Naming convention
# ─────────────────
# [meta.view.*]  – CREATE TEMP VIEW executed once at connection startup
# [meta.*]       – read-only SELECT statements against the temp views
# [run.*]        – read-write statements against the run database
# =============================================================================


# =============================================================================
# TEMP VIEW CREATION  (executed once per connection in MetaRepository.connect)
# =============================================================================
# Each view mirrors one meta table.  The WHERE clause bakes in the tenant
# filter so read queries need no further filtering.
# Structural substitutions used: {schema}, {gsr_client}, {gsr_inst}
# =============================================================================

# ---------------------------------------------------------------------------
# VIEW: data_source
# TENANT-FILTERED: only rows for the current (gsr_client, gsr_inst) pair.
# ---------------------------------------------------------------------------
[meta.view.data_source]
sql =
    CREATE TEMP VIEW data_source AS
    select
        gsr_src as source_id,
        left(name, 100) as source_name,
        description,

        -- Python DB-API 2.0 module, e.g. "psycopg2", "pyodbc", "cx_Oracle"
        'JayDeBeApi' as driver_module,

        -- Non-sensitive connection parameters (host, port, database name).
        -- Credentials (username, password) are never stored here.
        split_part(endpoint, ':', 1) as host,
        split_part(split_part(endpoint, ':', 2), '/', 1)::integer as port,
        split_part(split_part(endpoint, ':', 2), '/', 2) as database_name,

        -- Secret reference: a Secrets Manager secret name/ARN  OR  an env-var
        -- prefix.  The referenced secret / env-var group must contain:
        --   username  – database login name
        --   password  – database password
        -- Optionally it may also override host / port / dbname.
        config->>'secret' as secret_ref,

        -- Extra driver-specific kwargs merged into driver.connect() as-is.
        -- Example: {"charset": "utf8", "connect_timeout": 10}
        config as extra_params,
        is_active,
        '0001-01-01 00:00:00.000000'::timestamp without time zone as created_at,
        '8888-12-31 23:59:59.000000'::timestamp without time zone as updated_at
    from intf_automation.sources
    where gsr_client = '{gsr_client}'::uuid and gsr_inst = '{gsr_inst}'::uuid


# ---------------------------------------------------------------------------
# VIEW: source_table
# TENANT-FILTERED: only rows for the current (gsr_client, gsr_inst) pair.
# ---------------------------------------------------------------------------
[meta.view.source_table]
sql =
    CREATE TEMP VIEW source_table AS
    select
        lpad(gsr_seq::varchar, 32, '0')::uuid as table_id,
        gsr_src as source_id,
        left(schemaname, 255) as schema_name,
        left(tablename, 255) as table_name,

        -- When set, replaces the default "SELECT * FROM <schema>.<table>".
        '' as override_query,

        -- Numeric or date column used for range partitioning.
        -- NULL means the driver falls back to fetchmany() batching.
        null as partition_column,
        null as partition_size,

        '' as description,
        true as is_active,
        '0001-01-01 00:00:00.000000'::timestamp without time zone as created_at,
        gsr_sdts as updated_at
    from intf_automation.tables
    where gsr_client = '{gsr_client}'::uuid and gsr_inst = '{gsr_inst}'::uuid


# ---------------------------------------------------------------------------
# VIEW: graph_entity
# Not tenant-filtered (shared graph vocabulary); exposes all rows.
# ---------------------------------------------------------------------------
[meta.view.graph_entity]
sql =
    CREATE TEMP VIEW graph_entity AS
    select
        h.gsr_id as entity_id,
        h.hub_name as entity_name,
        'node' as entity_type,
        -- For edges: the node labels that define the two endpoints.
        null as from_node_label,
        null as to_node_label,
        array_to_string(r.realization, ' ') as description,
        '0001-01-01 00:00:00.000000'::timestamp without time zone as created_at,
        h.gsr_sdts as updated_at
    from intf_automation.hubs h
    left join intf_automation.hubs_realization r on r.gsr_client = '{gsr_client}'::uuid and r.gsr_inst = '{gsr_inst}'::uuid and r.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and r.hub_name = h.hub_name
    where h.gsr_client = '{gsr_client}'::uuid and h.gsr_inst = '{gsr_inst}'::uuid
      and h.gsr_sdts = '{gsr_sdts}'::timestamp without time zone
     and h.tags::text[] @> ARRAY['knowledge-graph']
    union all
    select
        l.gsr_id as entity_id,
        l.link_name || '.' || l.link_no as entity_name,
        'node' as entity_type,
        -- For edges: the node labels that define the two endpoints.
        null as from_node_label,
        null as to_node_label,
        array_to_string(r.realization, ' ') as description,
        '0001-01-01 00:00:00.000000'::timestamp without time zone as created_at,
        l.gsr_sdts as updated_at
    from intf_automation.links l
    left join intf_automation.links_realization r on r.gsr_client = '{gsr_client}'::uuid and r.gsr_inst = '{gsr_inst}'::uuid and r.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and r.link_name = l.link_name and r.link_no = l.link_no
    where l.gsr_client = '{gsr_client}'::uuid and l.gsr_inst = '{gsr_inst}'::uuid
      and l.gsr_sdts = '{gsr_sdts}'::timestamp without time zone
     and l.tags::text[] @> ARRAY['knowledge-graph']
    union all
    select
        lr.gsr_id as entity_id,
        lr.link_name || '.' || lr.link_no || '.' || lr.column_name as entity_name,
        'edge' as entity_type,
        -- For edges: the node labels that define the two endpoints.
        lr.link_name || '.' || lr.link_no as from_node_label,
        lr.reference_name as to_node_label,
        array_to_string(r.realization, ' ') as description,
        '0001-01-01 00:00:00.000000'::timestamp without time zone as created_at,
        lr.gsr_sdts as updated_at
    from intf_automation.link_references lr
    left join intf_ruleengine.link_references_realization r on r.gsr_client = '{gsr_client}'::uuid and r.gsr_inst = '{gsr_inst}'::uuid and r.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and r.link_name = lr.link_name and r.link_no = lr.link_no and r.column_name = lr.column_name
    where lr.gsr_client = '{gsr_client}'::uuid and lr.gsr_inst = '{gsr_inst}'::uuid
      and lr.gsr_sdts = '{gsr_sdts}'::timestamp without time zone
     and lr.tags::text[] @> ARRAY['knowledge-graph']


# ---------------------------------------------------------------------------
# VIEW: entity_mapping
# TENANT-FILTERED: only rows for the current (gsr_client, gsr_inst) pair.
# ---------------------------------------------------------------------------
[meta.view.entity_mapping]
sql =
    CREATE TEMP VIEW entity_mapping AS
    select
        hl.gsr_id as mapping_id,
        lpad(t.gsr_seq::varchar, 32, '0')::uuid as table_id,
        'node' as entity_type,

        -- Python eval expression that produces the Neptune ~id string from a
        -- source row dict (column names are local variables).
        -- Example: "'Customer_' + str(customer_id)"
        null as id_column_expr,

        -- Edge-only: expressions for ~from and ~to node IDs.
        null as from_id_column_expr,
        null as to_id_column_expr,

        -- -----------------------------------------------------------------------
        -- Change-detection mode
        -- -----------------------------------------------------------------------
        -- 'timestamp'  WHERE <watermark_column> > last_watermark (stored in run DB)
        -- 'hash'       Full scan + SHA-256; detects inserts, updates, and deletes
        -- 'full'       Always re-upserts every row; deletes by id-set difference
        'full' as change_mode,

        -- change_mode = 'timestamp': source column holding the last-modified time.
        null as watermark_column,

        -- change_mode = 'timestamp': source column holding the last-modified time.
        null as watermark_column,

        -- change_mode = 'timestamp': source column or expression that is truthy
        -- for logically deleted rows.  Matching rows are hard-deleted in Neptune.
        -- Leave NULL when the source does not expose deletes in this mode.
        null as delete_flag_column,

        -- change_mode = 'hash' / 'full': columns included in the SHA-256 digest.
        -- NULL = all active attribute_mapping columns are hashed.
        null as hash_columns,

        array_to_string(r.realization, ' ') as description,

        true as is_active,
        '0001-01-01 00:00:00.000000'::timestamp without time zone as created_at,
        hl.gsr_sdts as updated_at
    from intf_automation.hub_loads hl
    left join intf_automation.tables t on t.gsr_client = '{gsr_client}'::uuid and t.gsr_inst = '{gsr_inst}'::uuid and t.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and t.catalogname = hl.source_catalog and t.schemaname = hl.source_schema and t.tablename = hl.source_table
    left join intf_automation.entities e on e.gsr_client = '{gsr_client}'::uuid and e.gsr_inst = '{gsr_inst}'::uuid and e.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and e.entity_name = hl.hub_name
    left join intf_automation.hub_loads_realization r on r.gsr_client = '{gsr_client}'::uuid and r.gsr_inst = '{gsr_inst}'::uuid and r.gsr_src = hl.gsr_src and r.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and r.hub_name = hl.hub_name
    where hl.gsr_client = '{gsr_client}'::uuid and hl.gsr_inst = '{gsr_inst}'::uuid
      and hl.gsr_sdts = '{gsr_sdts}'::timestamp without time zone
     and hl.tags::text[] @> ARRAY['knowledge-graph']
    union all
    select
        ll.gsr_id as mapping_id,
        lpad(t.gsr_seq::varchar, 32, '0')::uuid as table_id,
        'node' as entity_type,

        -- Python eval expression that produces the Neptune ~id string from a
        -- source row dict (column names are local variables).
        -- Example: "'Customer_' + str(customer_id)"
        null as id_column_expr,

        -- Edge-only: expressions for ~from and ~to node IDs.
        null as from_id_column_expr,
        null as to_id_column_expr,

        -- -----------------------------------------------------------------------
        -- Change-detection mode
        -- -----------------------------------------------------------------------
        -- 'timestamp'  WHERE <watermark_column> > last_watermark (stored in run DB)
        -- 'hash'       Full scan + SHA-256; detects inserts, updates, and deletes
        -- 'full'       Always re-upserts every row; deletes by id-set difference
        'full' as change_mode,

        -- change_mode = 'timestamp': source column holding the last-modified time.
        null as watermark_column,

        -- change_mode = 'timestamp': source column holding the last-modified time.
        null as watermark_column,

        -- change_mode = 'timestamp': source column or expression that is truthy
        -- for logically deleted rows.  Matching rows are hard-deleted in Neptune.
        -- Leave NULL when the source does not expose deletes in this mode.
        null as delete_flag_column,

        -- change_mode = 'hash' / 'full': columns included in the SHA-256 digest.
        -- NULL = all active attribute_mapping columns are hashed.
        null as hash_columns,

        array_to_string(r.realization, ' ') as description,

        true as is_active,
        '0001-01-01 00:00:00.000000'::timestamp without time zone as created_at,
        ll.gsr_sdts as updated_at
    from intf_automation.link_loads ll
    left join intf_automation.tables t on t.gsr_client = '{gsr_client}'::uuid and t.gsr_inst = '{gsr_inst}'::uuid and t.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and t.catalogname = ll.source_catalog and t.schemaname = ll.source_schema and t.tablename = ll.source_table
    left join intf_automation.entities e on e.gsr_client = '{gsr_client}'::uuid and e.gsr_inst = '{gsr_inst}'::uuid and e.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and e.entity_name = ll.link_name and e.entity_no = ll.link_no
    left join intf_automation.link_loads_realization r on r.gsr_client = '{gsr_client}'::uuid and r.gsr_inst = '{gsr_inst}'::uuid and r.gsr_src = ll.gsr_src and r.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and r.link_name = ll.link_name and r.link_no = ll.link_no
    where ll.gsr_client = '{gsr_client}'::uuid and ll.gsr_inst = '{gsr_inst}'::uuid
      and ll.gsr_sdts = '{gsr_sdts}'::timestamp without time zone
      and ll.tags::text[] @> ARRAY['knowledge-graph']
    union all
    select
        lrl.gsr_id as mapping_id,
        lpad(t.gsr_seq::varchar, 32, '0')::uuid as table_id,
        'edge' as entity_type,

        -- Python eval expression that produces the Neptune ~id string from a
        -- source row dict (column names are local variables).
        -- Example: "'Customer_' + str(customer_id)"
        null as id_column_expr,

        -- Edge-only: expressions for ~from and ~to node IDs.
        null as from_id_column_expr,
        null as to_id_column_expr,

        -- -----------------------------------------------------------------------
        -- Change-detection mode
        -- -----------------------------------------------------------------------
        -- 'timestamp'  WHERE <watermark_column> > last_watermark (stored in run DB)
        -- 'hash'       Full scan + SHA-256; detects inserts, updates, and deletes
        -- 'full'       Always re-upserts every row; deletes by id-set difference
        'full' as change_mode,

        -- change_mode = 'timestamp': source column holding the last-modified time.
        null as watermark_column,

        -- change_mode = 'timestamp': source column holding the last-modified time.
        null as watermark_column,

        -- change_mode = 'timestamp': source column or expression that is truthy
        -- for logically deleted rows.  Matching rows are hard-deleted in Neptune.
        -- Leave NULL when the source does not expose deletes in this mode.
        null as delete_flag_column,

        -- change_mode = 'hash' / 'full': columns included in the SHA-256 digest.
        -- NULL = all active attribute_mapping columns are hashed.
        null as hash_columns,

        array_to_string(r.realization, ' ') as description,

        true as is_active,
        '0001-01-01 00:00:00.000000'::timestamp without time zone as created_at,
        lrl.gsr_sdts as updated_at
    from intf_automation.link_reference_loads lrl
    left join intf_automation.link_reference_loads_realization r on r.gsr_client = '{gsr_client}'::uuid and r.gsr_inst = '{gsr_inst}'::uuid and r.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and r.link_name = lrl.link_name and r.link_no = lrl.link_no and r.column_name = lrl.column_name
    left join intf_automation.tables t on t.gsr_client = '{gsr_client}'::uuid and t.gsr_inst = '{gsr_inst}'::uuid and t.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and t.catalogname = lrl.source_catalog and t.schemaname = lrl.source_schema and t.tablename = lrl.source_table
    left join intf_automation.entities e on e.gsr_client = '{gsr_client}'::uuid and e.gsr_inst = '{gsr_inst}'::uuid and e.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and e.entity_name = lrl.link_name and e.entity_no = lrl.link_no
    where lrl.gsr_client = '{gsr_client}'::uuid and lrl.gsr_inst = '{gsr_inst}'::uuid
      and lrl.gsr_sdts = '{gsr_sdts}'::timestamp without time zone
     and lrl.tags::text[] @> ARRAY['knowledge-graph']


# ---------------------------------------------------------------------------
# VIEW: attribute_mapping
# TENANT-FILTERED: only rows for the current (gsr_client, gsr_inst) pair.
# ---------------------------------------------------------------------------
[meta.view.attribute_mapping]
sql =
    CREATE TEMP VIEW attribute_mapping AS
    select
        kl.gsr_id as attr_id,
        e.gsr_id as mapping_id,

        -- Source column name, or a SQL expression (e.g. "UPPER(last_name)").
        left(kl.source_column, 500) as source_column,

        -- Target Neptune property key.
        left(kl.column_name, 255) as target_property,

        -- Neptune type annotation used in bulk-load CSV headers and Gremlin writes.
        case
            when k.data_type = 'bi.flow.types.array' then 'String'
            when k.data_type = 'bi.flow.types.bigint' then 'Long'
            when k.data_type = 'bi.flow.types.binary' then 'String'
            when k.data_type = 'bi.flow.types.bit' then 'Bool'
            when k.data_type = 'bi.flow.types.blob' then 'String'
            when k.data_type = 'bi.flow.types.boolean' then 'Bool'
            when k.data_type = 'bi.flow.types.char' then 'String'
            when k.data_type = 'bi.flow.types.clob' then 'String'
            when k.data_type = 'bi.flow.types.datalink' then 'String'
            when k.data_type = 'bi.flow.types.date' then 'Date'
            when k.data_type = 'bi.flow.types.decimal' then 'Double'
            when k.data_type = 'bi.flow.types.distinct' then 'String'
            when k.data_type = 'bi.flow.types.double' then 'Double'
            when k.data_type = 'bi.flow.types.float' then 'Float'
            when k.data_type = 'bi.flow.types.integer' then 'Int'
            when k.data_type = 'bi.flow.types.json' then 'String'
            when k.data_type = 'bi.flow.types.longvarbinary' then 'String'
            when k.data_type = 'bi.flow.types.longvarchar' then 'String'
            when k.data_type = 'bi.flow.types.null' then 'String'
            when k.data_type = 'bi.flow.types.numeric' then 'Float'
            when k.data_type = 'bi.flow.types.object' then 'String'
            when k.data_type = 'bi.flow.types.other' then 'String'
            when k.data_type = 'bi.flow.types.real' then 'Double'
            when k.data_type = 'bi.flow.types.refcursor' then 'String'
            when k.data_type = 'bi.flow.types.ref' then 'String'
            when k.data_type = 'bi.flow.types.rowid' then 'String'
            when k.data_type = 'bi.flow.types.smallint' then 'Int'
            when k.data_type = 'bi.flow.types.struct' then 'String'
            when k.data_type = 'bi.flow.types.timestamp' then 'DateTime'
            when k.data_type = 'bi.flow.types.timestampwithtimezone' then 'DateTime'
            when k.data_type = 'bi.flow.types.time' then 'DateTime'
            when k.data_type = 'bi.flow.types.timewithtimezone' then 'DateTime'
            when k.data_type = 'bi.flow.types.tinyint' then 'Int'
            when k.data_type = 'bi.flow.types.varbinary' then 'String'
            when k.data_type = 'bi.flow.types.varchar' then 'String'
            when k.data_type = 'bi.flow.types.xml' then 'String'
            else 'String'
        end as data_type,

        true as is_id_component,
        true as nullable,

        -- Optional Python eval expression applied to the raw value before writing.
        -- The variable "value" holds the raw source value.
        -- Example: "value.strip().upper()"
        null as transform_expr,

        -- -----------------------------------------------------------------------
        -- attribute-level classification (hybrid tagging model)
        -- -----------------------------------------------------------------------
        -- These values are emitted as companion properties on the owning data node
        -- using the naming convention:
        --   <target_property>__privacy_class
        --   <target_property>__security_class
        -- Example: target_property = 'email'
        --   → Neptune property 'email__privacy_class'  = 'PII'
        --   → Neptune property 'email__security_class' = 'CONFIDENTIAL'
        -- NULL means no classification applies; no companion property is written.
        k.privacy_class,
        k.security_class,

        array_to_string(kr.realization, ' ') as description,
        true as is_active,
        '0001-01-01 00:00:00.000000'::timestamp without time zone as created_at,
        kl.gsr_sdts as updated_at

    from intf_automation.key_loads kl
    inner join intf_automation.keys k on k.gsr_client = '{gsr_client}'::uuid and k.gsr_inst = '{gsr_inst}'::uuid and k.entity_name = kl.entity_name and k.column_name = kl.column_name
    left join intf_automation.keys_realization kr on kr.gsr_client = '{gsr_client}'::uuid and kr.gsr_inst = '{gsr_inst}'::uuid and kr.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and kr.entity_name = k.entity_name and kr.column_name = k.column_name
    inner join intf_automation.entities e on e.gsr_client = '{gsr_client}'::uuid and e.gsr_inst = '{gsr_inst}'::uuid and e.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and k.entity_name = e.entity_name
    where
        k.gsr_client = '{gsr_client}'::uuid and k.gsr_inst = '{gsr_inst}'::uuid
      and k.gsr_sdts = '{gsr_sdts}'::timestamp without time zone
     and k.tags::text[] @> ARRAY['knowledge-graph']
    union all
    select
        al.gsr_id as attr_id,
        e.gsr_id as mapping_id,

        -- Source column name, or a SQL expression (e.g. "UPPER(last_name)").
        left(al.source_column, 500) as source_column,

        -- Target Neptune property key.
        left(al.column_name, 255) as target_property,

        -- Neptune type annotation used in bulk-load CSV headers and Gremlin writes.
        case
            when a.data_type = 'bi.flow.types.array' then 'String'
            when a.data_type = 'bi.flow.types.bigint' then 'Long'
            when a.data_type = 'bi.flow.types.binary' then 'String'
            when a.data_type = 'bi.flow.types.bit' then 'Bool'
            when a.data_type = 'bi.flow.types.blob' then 'String'
            when a.data_type = 'bi.flow.types.boolean' then 'Bool'
            when a.data_type = 'bi.flow.types.char' then 'String'
            when a.data_type = 'bi.flow.types.clob' then 'String'
            when a.data_type = 'bi.flow.types.datalink' then 'String'
            when a.data_type = 'bi.flow.types.date' then 'Date'
            when a.data_type = 'bi.flow.types.decimal' then 'Double'
            when a.data_type = 'bi.flow.types.distinct' then 'String'
            when a.data_type = 'bi.flow.types.double' then 'Double'
            when a.data_type = 'bi.flow.types.float' then 'Float'
            when a.data_type = 'bi.flow.types.integer' then 'Int'
            when a.data_type = 'bi.flow.types.json' then 'String'
            when a.data_type = 'bi.flow.types.longvarbinary' then 'String'
            when a.data_type = 'bi.flow.types.longvarchar' then 'String'
            when a.data_type = 'bi.flow.types.null' then 'String'
            when a.data_type = 'bi.flow.types.numeric' then 'Float'
            when a.data_type = 'bi.flow.types.object' then 'String'
            when a.data_type = 'bi.flow.types.other' then 'String'
            when a.data_type = 'bi.flow.types.real' then 'Double'
            when a.data_type = 'bi.flow.types.refcursor' then 'String'
            when a.data_type = 'bi.flow.types.ref' then 'String'
            when a.data_type = 'bi.flow.types.rowid' then 'String'
            when a.data_type = 'bi.flow.types.smallint' then 'Int'
            when a.data_type = 'bi.flow.types.struct' then 'String'
            when a.data_type = 'bi.flow.types.timestamp' then 'DateTime'
            when a.data_type = 'bi.flow.types.timestampwithtimezone' then 'DateTime'
            when a.data_type = 'bi.flow.types.time' then 'DateTime'
            when a.data_type = 'bi.flow.types.timewithtimezone' then 'DateTime'
            when a.data_type = 'bi.flow.types.tinyint' then 'Int'
            when a.data_type = 'bi.flow.types.varbinary' then 'String'
            when a.data_type = 'bi.flow.types.varchar' then 'String'
            when a.data_type = 'bi.flow.types.xml' then 'String'
            else 'String'
        end as data_type,

        false as is_id_component,
        true as nullable,

        -- Optional Python eval expression applied to the raw value before writing.
        -- The variable "value" holds the raw source value.
        -- Example: "value.strip().upper()"
        null as transform_expr,

        -- -----------------------------------------------------------------------
        -- Attribute-level classification (hybrid tagging model)
        -- -----------------------------------------------------------------------
        -- These values are emitted as companion properties on the owning data node
        -- using the naming convention:
        --   <target_property>__privacy_class
        --   <target_property>__security_class
        -- Example: target_property = 'email'
        --   → Neptune property 'email__privacy_class'  = 'PII'
        --   → Neptune property 'email__security_class' = 'CONFIDENTIAL'
        -- NULL means no classification applies; no companion property is written.
        a.privacy_class,
        a.security_class,

        array_to_string(ar.realization, ' ') as description,
        true as is_active,
        '0001-01-01 00:00:00.000000'::timestamp without time zone as created_at,
        al.gsr_sdts as updated_at

    from intf_automation.attribute_loads al
    inner join intf_automation.attributes a on a.gsr_client = '{gsr_client}'::uuid and a.gsr_inst = '{gsr_inst}'::uuid and a.entity_name = al.entity_name and a.column_name = al.column_name
    left join intf_automation.attributes_realization ar on ar.gsr_client = '{gsr_client}'::uuid and ar.gsr_inst = '{gsr_inst}'::uuid and ar.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and ar.entity_name = a.entity_name and ar.column_name = a.column_name
    inner join intf_automation.entities e on e.gsr_client = '{gsr_client}'::uuid and e.gsr_inst = '{gsr_inst}'::uuid and e.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and a.entity_name = e.entity_name
    where
        a.gsr_client = '{gsr_client}'::uuid and a.gsr_inst = '{gsr_inst}'::uuid
      and a.gsr_sdts = '{gsr_sdts}'::timestamp without time zone
     and a.tags::text[] @> ARRAY['knowledge-graph']


# ---------------------------------------------------------------------------
# VIEW: concept_tag
# TENANT-FILTERED: only rows for the current (gsr_client, gsr_inst) pair.
# ---------------------------------------------------------------------------
[meta.view.concept_tag]
sql =
    CREATE TEMP VIEW concept_tag AS
    select
        md5(regexp_replace(replace(lower(concept_name), ' ', '_'), '[^[:ascii:]]', '', 'g'))::uuid as tag_id,

        -- Short machine-friendly name, unique within a category.
        -- This becomes the 'name' property of the :ConceptTag Neptune node.
        -- Example: 'PII', 'Finance', 'Person'
        regexp_replace(replace(lower(concept_name), ' ', '_'), '[^[:ascii:]]', '', 'g') as tag_name,

        -- Groups tags into orthogonal classification axes.
        -- Example: 'business_domain', 'data_classification', 'ontology_class'
        'business_domain' as tag_category,

        -- Human-readable label shown in UIs; defaults to tag_name if NULL.
        left(concept_name, 100) as display_name,

        '' as description,
        true as is_active,
        '0001-01-01 00:00:00.000000'::timestamp without time zone as created_at,
        min(tc.gsr_sdts) as updated_at


    from intf_automation.table_concepts tc
    where tc.gsr_client = '{gsr_client}'::uuid and tc.gsr_inst = '{gsr_inst}'::uuid
      and tc.gsr_sdts = '{gsr_sdts}'::timestamp without time zone
    group by tc.concept_name


# ---------------------------------------------------------------------------
# VIEW: entity_tag
# TENANT-FILTERED: only rows for the current (gsr_client, gsr_inst) pair.
# ---------------------------------------------------------------------------
[meta.view.entity_tag]
sql =
    CREATE TEMP VIEW entity_tag AS
    select
        gen_random_uuid() as entity_tag_id,

        -- The entity mapping whose nodes should carry this tag.
        hl.gsr_id as mapping_id,

        -- The tag to apply.
        md5(regexp_replace(replace(lower(tc.concept_name), ' ', '_'), '[^[:ascii:]]', '', 'g'))::uuid as tag_id,

        '' as description,
        true as is_active,
        '0001-01-01 00:00:00.000000'::timestamp without time zone as created_at,
        hl.gsr_sdts as updated_at
    from
        intf_automation.hub_loads hl
    inner join
        intf_automation.table_concepts tc on tc.gsr_client = '{gsr_client}'::uuid and tc.gsr_inst = '{gsr_inst}'::uuid and tc.gsr_src = hl.gsr_src and tc.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and tc.catalog_name = hl.source_catalog and tc.schema_name = hl.source_schema and tc.table_name = hl.source_table
    where
        hl.gsr_client = '{gsr_client}'::uuid and hl.gsr_inst = '{gsr_inst}'::uuid
      and hl.gsr_sdts = '{gsr_sdts}'::timestamp without time zone
     and hl.tags::text[] @> ARRAY['knowledge-graph']
    union all
    select
        gen_random_uuid() as entity_tag_id,

        -- The entity mapping whose nodes should carry this tag.
        ll.gsr_id as mapping_id,

        -- The tag to apply.
        md5(regexp_replace(replace(lower(tc.concept_name), ' ', '_'), '[^[:ascii:]]', '', 'g'))::uuid as tag_id,

        '' as description,
        true as is_active,
        '0001-01-01 00:00:00.000000'::timestamp without time zone as created_at,
        ll.gsr_sdts as updated_at
    from
        intf_automation.link_loads ll
    inner join
        intf_automation.table_concepts tc on tc.gsr_client = '{gsr_client}'::uuid and tc.gsr_inst = '{gsr_inst}'::uuid and tc.gsr_src = ll.gsr_src and tc.gsr_sdts = '{gsr_sdts}'::timestamp without time zone and tc.catalog_name = ll.source_catalog and tc.schema_name = ll.source_schema and tc.table_name = ll.source_table
    where
        ll.gsr_client = '{gsr_client}'::uuid and ll.gsr_inst = '{gsr_inst}'::uuid
      and ll.gsr_sdts = '{gsr_sdts}'::timestamp without time zone
     and ll.tags::text[] @> ARRAY['knowledge-graph']


# =============================================================================
# READ QUERIES  (run after temp views are in place)
# No {schema}, {gsr_client}, {gsr_inst} substitutions needed here:
#   • schema   – views are resolved via pg_temp (front of search_path)
#   • tenant   – already baked into the view WHERE clause
# =============================================================================

# ---------------------------------------------------------------------------
# META  –  load_mappings
# Returns all active entity mappings for the tenant, joined to source and
# graph entity metadata, ordered for correct load sequencing (nodes first).
# No bind parameters.
# ---------------------------------------------------------------------------
[meta.load_mappings]
sql =
    SELECT
        em.mapping_id::text,
        em.table_id::text,
        em.entity_id::text,
        ge.entity_name,
        ge.entity_type,
        em.id_column_expr,
        em.from_id_column_expr,
        em.to_id_column_expr,
        em.row_filter,
        em.change_mode,
        em.watermark_column,
        em.delete_flag_column,
        em.hash_columns,
        ds.source_id::text,
        ds.driver_module,
        ds.host,
        ds.port,
        ds.database_name,
        ds.secret_ref,
        ds.extra_params,
        st.schema_name,
        st.table_name,
        st.override_query,
        st.partition_column,
        st.partition_size,
        em.load_order
    FROM entity_mapping  em
    JOIN graph_entity    ge ON ge.entity_id = em.entity_id
    JOIN source_table    st ON st.table_id  = em.table_id
    JOIN data_source     ds ON ds.source_id = st.source_id
    ORDER BY em.load_order, em.mapping_id


# ---------------------------------------------------------------------------
# META  –  load_attributes
# Returns all active attribute mappings for a single entity mapping.
# Bind parameter: %s = mapping_id (UUID string)
# ---------------------------------------------------------------------------
[meta.load_attributes]
sql =
    SELECT
        attr_id::text,
        source_column,
        target_property,
        data_type,
        nullable,
        transform_expr,
        is_id_component,
        privacy_class,
        security_class
    FROM attribute_mapping
    WHERE mapping_id = %s::uuid
    ORDER BY attr_id


# ---------------------------------------------------------------------------
# META  –  load_concept_tags
# Returns all active concept tag assignments across all mappings for the tenant,
# joined to concept_tag for tag metadata.
# No bind parameters.
# ---------------------------------------------------------------------------
[meta.load_concept_tags]
sql =
    SELECT
        et.mapping_id::text,
        ct.tag_id::text,
        ct.tag_name,
        ct.tag_category,
        ct.display_name
    FROM entity_tag  et
    JOIN concept_tag ct ON ct.tag_id = et.tag_id


# =============================================================================
# RUN DB QUERIES  (all use {schema} structural substitution)
# =============================================================================

# ---------------------------------------------------------------------------
# RUN  –  start_run
# Inserts a new load_run row.  run_id is generated in Python (uuid4).
# Bind parameters: %s = run_id, run_type, started_at, s3_prefix, triggered_by
# ---------------------------------------------------------------------------
[run.start_run]
sql =
    INSERT INTO {schema}.load_run
        (run_id, run_type, started_at, s3_prefix, triggered_by)
    VALUES (%s::uuid, %s, %s, %s, %s)


# ---------------------------------------------------------------------------
# RUN  –  finish_run
# Updates a load_run row at the end of a pipeline execution.
# Bind parameters: %s = finished_at, status, bulk_load_job_id,
#                       rows_upserted, rows_deleted, rows_skipped,
#                       error_message, run_id
# ---------------------------------------------------------------------------
[run.finish_run]
sql =
    UPDATE {schema}.load_run
    SET finished_at     = %s,
        status          = %s,
        bulk_load_job_id = %s,
        rows_upserted   = %s,
        rows_deleted    = %s,
        rows_skipped    = %s,
        error_message   = %s
    WHERE run_id = %s::uuid


# ---------------------------------------------------------------------------
# RUN  –  record_detail
# Inserts per-mapping statistics for one pipeline run.
# Bind parameters: %s = run_id, mapping_id, operation, s3_uri,
#                       rows_upserted, rows_deleted, rows_skipped,
#                       error_message, started_at, finished_at
# ---------------------------------------------------------------------------
[run.record_detail]
sql =
    INSERT INTO {schema}.load_run_detail
        (run_id, mapping_id, operation, s3_uri,
         rows_upserted, rows_deleted, rows_skipped,
         error_message, started_at, finished_at)
    VALUES (%s::uuid, %s::uuid, %s, %s, %s, %s, %s, %s, %s, %s)


# ---------------------------------------------------------------------------
# RUN  –  get_watermark
# Reads the committed high-water mark for timestamp-mode extraction.
# Bind parameters: %s = mapping_id
# ---------------------------------------------------------------------------
[run.get_watermark]
sql =
    SELECT last_watermark
    FROM {schema}.table_watermark
    WHERE mapping_id = %s::uuid


# ---------------------------------------------------------------------------
# RUN  –  set_pending_watermark
# Upserts the run-start timestamp as a pending watermark before source reads.
# Bind parameters: %s = mapping_id, pending_watermark, last_run_id, updated_at
# ---------------------------------------------------------------------------
[run.set_pending_watermark]
sql =
    INSERT INTO {schema}.table_watermark
        (mapping_id, pending_watermark, last_run_id, updated_at)
    VALUES (%s::uuid, %s, %s::uuid, %s)
    ON CONFLICT (mapping_id) DO UPDATE
        SET pending_watermark = EXCLUDED.pending_watermark,
            last_run_id       = EXCLUDED.last_run_id,
            updated_at        = EXCLUDED.updated_at


# ---------------------------------------------------------------------------
# RUN  –  commit_watermark
# Promotes pending_watermark to last_watermark after a successful run.
# Bind parameters: %s = updated_at, mapping_id
# ---------------------------------------------------------------------------
[run.commit_watermark]
sql =
    UPDATE {schema}.table_watermark
    SET last_watermark    = pending_watermark,
        pending_watermark = NULL,
        updated_at        = %s
    WHERE mapping_id = %s::uuid


# ---------------------------------------------------------------------------
# RUN  –  load_hashes
# Loads all stored SHA-256 fingerprints for a mapping (hash-mode detection).
# Bind parameters: %s = mapping_id
# ---------------------------------------------------------------------------
[run.load_hashes]
sql =
    SELECT entity_id_value, row_hash
    FROM {schema}.row_hash
    WHERE mapping_id = %s::uuid


# ---------------------------------------------------------------------------
# RUN  –  upsert_hashes
# Bulk-upserts row fingerprints using psycopg2 execute_values.
# The companion [run.upsert_hashes_template] section defines the per-row
# VALUES template passed to execute_values as its template= argument.
# Bind parameters: list of (mapping_id, entity_id_value, row_hash,
#                            first_seen_run_id, last_seen_run_id, updated_at)
# ---------------------------------------------------------------------------
[run.upsert_hashes]
sql =
    INSERT INTO {schema}.row_hash
        (mapping_id, entity_id_value, row_hash,
         first_seen_run_id, last_seen_run_id, updated_at)
    VALUES %s
    ON CONFLICT (mapping_id, entity_id_value) DO UPDATE
        SET row_hash         = EXCLUDED.row_hash,
            last_seen_run_id = EXCLUDED.last_seen_run_id,
            updated_at       = EXCLUDED.updated_at

[run.upsert_hashes_template]
sql = (%s::uuid, %s, %s, %s::uuid, %s::uuid, %s)


# ---------------------------------------------------------------------------
# RUN  –  delete_hashes
# Removes hash entries for entity IDs that were deleted from the source.
# Bind parameters: %s = mapping_id,  %s = list of entity_id_value strings
# ---------------------------------------------------------------------------
[run.delete_hashes]
sql =
    DELETE FROM {schema}.row_hash
    WHERE mapping_id      = %s::uuid
      AND entity_id_value = ANY(%s)


# ---------------------------------------------------------------------------
# RUN  –  clear_hashes
# Removes all hash entries for a set of mappings (called after a full reload).
# Bind parameters: %s = list of mapping_id UUID strings
# ---------------------------------------------------------------------------
[run.clear_hashes]
sql =
    DELETE FROM {schema}.row_hash
    WHERE mapping_id = ANY(%s::uuid[])


# ---------------------------------------------------------------------------
# RUN  –  clear_watermarks
# Removes all watermark entries for a set of mappings (after a full reload).
# Bind parameters: %s = list of mapping_id UUID strings
# ---------------------------------------------------------------------------
[run.clear_watermarks]
sql =
    DELETE FROM {schema}.table_watermark
    WHERE mapping_id = ANY(%s::uuid[])
